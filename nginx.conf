# Airline Nexus — static file server configuration
# Serves the Vite build output from /usr/share/nginx/html

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml font/woff2;
    gzip_min_length   512;

    # ── Logging ────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log combined;
    error_log   /var/log/nginx/error.log warn;

    # ── Server ─────────────────────────────────────────────────────────
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Vite content-hashed assets — cache forever (immutable)
        location ~* \.[a-f0-9]{8,}\.(js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Textures / images from public/ — cache 1 day
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # HTML entry point — no cache (allow reloads)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Catch-all
        location / {
            try_files $uri $uri/ =404;
        }
    }
}